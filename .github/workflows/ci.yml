name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: 📥 Checkout code
        uses: actions/checkout@v7

      - id: setup-node
        name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "npm"

      - id: install-dependencies
        name: 📦 Install dependencies
        run: npm ci

      - id: test
        name: 🧪 Run tests
        run: >-
          npm run test -- --coverage --reporter=junit
          --outputFile=test-report.junit.xml

      - id: test-upload-coverage
        name: 📊 Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage

      - id: test-upload-results
        name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test-report.junit.xml

  check:
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: 📥 Checkout code
        uses: actions/checkout@v7

      - id: setup-node
        name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "npm"

      - id: install-dependencies
        name: 📦 Install dependencies
        run: npm ci

      - id: astro-check
        name: ♍️ Run Astro check
        run: npm run check

  lint:
    runs-on: ubuntu-latest

    outputs:
      format-outcome: ${{ steps.format-check.outcome }}
      lint-outcome: ${{ steps.lint-check.outcome }}

    steps:
      - id: checkout
        name: 📥 Checkout code
        uses: actions/checkout@v7

      - id: setup-node
        name: ⚙️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "npm"

      - id: install-dependencies
        name: 📦 Install dependencies
        run: npm ci

      - id: format-check
        name: 💅 Run format check
        continue-on-error: true
        run: npm run format

      - id: lint-check
        name: 🚨 Run lint check
        continue-on-error: true
        run: npm run lint

      - id: lint-status
        name: ❗ Fail if lint checks failed
        if: >-
          steps.format-check.outcome == 'failure' ||
          steps.lint-check.outcome == 'failure'
        run: exit 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Wheel screenshots are approved in this image; its version must match
    # @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "npm"

      # Install scripts only build @swisseph/node, for the API, which the
      # browser tests don't call, and the image has no compiler.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

name: PR title

# Pull requests are squash-merged, so the title becomes the commit message
# on main that release-please reads. It must be a conventional commit:
# "feat: add lunar returns", "fix(ci): patch path-to-regexp".

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest

    steps:
      # Reads only the title, never the PR's code, so pull_request_target
      # is safe here and works for pull requests from forks.
      - id: check-title
        name: 🏷️ Check the title is a conventional commit
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            style
            refactor
            test
            build
            ci
            chore
          requireScope: false
          # A lowercase start, as in "feat: add lunar returns".
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            Start the description after the type with a lowercase letter,
            as in "feat: add lunar returns". "{subject}" doesn't.
